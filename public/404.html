    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }

      main { width: min(100%, 680px); padding: clamp(32px, 7vw, 64px); border: 1px solid #23436b; border-radius: 24px; background: #0b1a2e; }
      p:first-child { color: #8fb5ff; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
      h1 { margin: 16px 0; font-size: clamp(2.4rem, 8vw, 5rem); line-height: .98; }
      p { color: #bdcbe0; line-height: 1.65; }
      nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
      a { min-height: 44px; padding: 12px 18px; border: 1px solid #5e8fe6; border-radius: 999px; color: #fff; font-weight: 750; text-decoration: none; }
      a:first-child { background: #2d67d8; }
      a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p>Error 404</p>
